<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaRemote — Admin Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#0a0f1e',
            graphite: '#111827',
            cardborder: '#1f2937',
            brand: '#3b82f6',
            cyanAccent: '#06b6d4',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/app.css">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body class="bg-[#0a0f1e] text-gray-100 flex items-center justify-center min-h-screen px-4 py-8">

  <!-- Login Card Container -->
  <div class="w-full max-w-md">
    
    <!-- Header Brand -->
    <div class="flex flex-col items-center mb-8 text-center">
      <img src="assets/logo.svg" alt="NovaRemote Logo" class="h-12 mb-3">
      <p class="text-sm text-gray-400">Device Telemetry & Remote Control Administration</p>
    </div>

    <!-- Card -->
    <div class="card p-8 bg-[#111827] border border-[#1f2937]">
      <h1 class="text-xl font-bold text-white mb-6">Sign In to Dashboard</h1>

      <!-- Error Alert -->
      <div id="login-error" class="hidden mb-4 p-3 bg-red-900/30 border border-red-700/60 rounded-lg text-sm text-red-300">
      </div>

      <form id="login-form" class="space-y-4">
        <!-- Server URL Field -->
        <div>
          <label for="server-url" class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">
            Backend Server URL
          </label>
          <input 
            type="url" 
            id="server-url" 
            name="server-url" 
            value="http://localhost:8000" 
            required 
            placeholder="http://localhost:8000"
            class="w-full px-3.5 py-2.5 bg-[#0a0f1e] border border-[#1f2937] rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
          >
        </div>

        <!-- Username Field -->
        <div>
          <label for="username" class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">
            Admin Username
          </label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            required 
            placeholder="admin"
            autocomplete="username"
            class="w-full px-3.5 py-2.5 bg-[#0a0f1e] border border-[#1f2937] rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
          >
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1.5">
            Password
          </label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            required 
            placeholder="••••••••••••"
            autocomplete="current-password"
            class="w-full px-3.5 py-2.5 bg-[#0a0f1e] border border-[#1f2937] rounded-lg text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
          >
        </div>

        <!-- Submit Button with Spinner -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="btn-submit" 
            class="btn-primary w-full py-2.5 flex items-center justify-center gap-2 text-sm font-semibold"
          >
            <!-- Loading Spinner SVG -->
            <svg id="login-spinner" class="hidden animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="btn-text">Sign In</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Security & Version Footer -->
    <div class="text-center mt-6 text-xs text-gray-500">
      NovaRemote System &bull; Phase 1 Architecture
    </div>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <!-- Script Module -->
  <script type="module">
    import { auth, handleLoginForm } from './js/auth.js';

    // Auto-fill server URL if already stored previously
    const storedServer = auth.getServerUrl();
    if (storedServer) {
      const serverInput = document.getElementById('server-url');
      if (serverInput) serverInput.value = storedServer;
    }

    // Check query reason (e.g. session expired)
    const urlParams = new URLSearchParams(window.location.search);
    const reason = urlParams.get('reason');
    if (reason === 'session_expired') {
      const err = document.getElementById('login-error');
      err.textContent = 'Your session has expired. Please log in again.';
      err.classList.remove('hidden');
    }

    // Hook Form Submit
    const form = document.getElementById('login-form');
    const errEl = document.getElementById('login-error');
    const spinnerEl = document.getElementById('login-spinner');
    const btnEl = document.getElementById('btn-submit');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLoginForm(form, errEl, spinnerEl, btnEl);
    });
  </script>
</body>
</html>
